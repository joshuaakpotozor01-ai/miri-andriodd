<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Miri</title>
<style>
  :root{
    --bg:#050608;
    --bg-2:#0a0c10;
    --text:#e9ecf2;
    --text-dim:#7a8194;
    --accent:#5b8cff;
    --danger:#ff5b6e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:radial-gradient(ellipse at 50% 20%, var(--bg-2), var(--bg) 70%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
  }
  .stage{
    position:relative;
    height:100dvh; width:100vw;
    display:flex; flex-direction:column;
    align-items:center; justify-content:space-between;
    padding: max(24px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
  }

  /* ---- top bar ---- */
  .topbar{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    font-size:13px; color:var(--text-dim); letter-spacing:.02em;
  }
  .status-pill{
    display:flex; align-items:center; gap:7px;
    padding:6px 12px; border-radius:20px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.07);
  }
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--text-dim); transition:background .3s;}
  .status-pill.listening .status-dot{background:var(--accent); box-shadow:0 0 8px var(--accent);}
  .status-pill.speaking .status-dot{background:#8fd6a8; box-shadow:0 0 8px #8fd6a8;}
  .status-pill.error .status-dot{background:var(--danger); box-shadow:0 0 8px var(--danger);}

  /* ---- orb ---- */
  .orb-zone{
    flex:1; width:100%;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .orb-wrap{
    position:relative;
    width:min(58vw, 260px); height:min(58vw, 260px);
    border-radius:50%;
    transition: transform .18s ease-out;
  }
  .orb-glow{
    position:absolute; inset:-30%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(91,140,255,0.35), transparent 65%);
    filter:blur(18px);
    opacity:.5;
    transition:opacity .3s ease, transform .18s ease-out;
    pointer-events:none;
  }
  .orb-video{
    width:100%; height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    filter:saturate(1.15);
    box-shadow:
      0 0 40px rgba(91,140,255,0.25),
      0 0 90px rgba(91,140,255,0.12);
  }
  .orb-ring{
    position:absolute; inset:-14px;
    border-radius:50%;
    border:1.5px solid rgba(91,140,255,0.35);
    opacity:0;
    transition:opacity .3s ease;
  }
  .orb-wrap.listening .orb-ring{ opacity:1; animation:pulse-ring 1.6s ease-out infinite; }
  @keyframes pulse-ring{
    0%{transform:scale(0.94); opacity:.7;}
    100%{transform:scale(1.25); opacity:0;}
  }
  .orb-wrap.idle .orb-video{ animation: breathe 4.5s ease-in-out infinite; }
  @keyframes breathe{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.035); }
  }

  .transcript{
    min-height:52px;
    max-width:88vw;
    text-align:center;
    font-size:17px;
    line-height:1.45;
    color:var(--text);
    font-weight:400;
    padding:0 8px;
  }
  .transcript.dim{ color:var(--text-dim); font-size:15px; }

  /* ---- bottom controls ---- */
  .controls{
    width:100%;
    display:flex; flex-direction:column; align-items:center; gap:16px;
  }
  .mic-btn{
    width:74px; height:74px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.04);
    display:flex; align-items:center; justify-content:center;
    color:var(--text);
    cursor:pointer;
    transition: background .2s, transform .12s, border-color .2s;
  }
  .mic-btn:active{ transform:scale(0.94); }
  .mic-btn.on{
    background:rgba(91,140,255,0.18);
    border-color:rgba(91,140,255,0.5);
  }
  .mic-btn svg{ width:26px; height:26px; }

  .hint{ font-size:12.5px; color:var(--text-dim); text-align:center; }

  .settings-row{
    display:flex; gap:10px; width:100%; justify-content:center;
    flex-wrap:wrap;
  }
  select, .chip-btn{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.09);
    color:var(--text-dim);
    font-size:12px;
    padding:7px 10px;
    border-radius:10px;
    max-width:44vw;
  }
  select:focus, .chip-btn:focus{ outline:none; }

  ::selection{ background:rgba(91,140,255,.4); }

  @media (prefers-reduced-motion: reduce){
    .orb-wrap.idle .orb-video, .orb-wrap.listening .orb-ring{ animation:none; }
  }
</style>
</head>

  }
  tickClock(); setInterval(tickClock, 15000);

  // ---------- state machine ----------
  // states: idle | listening | thinking | speaking | error
  function setState(state, label){
    orbWrap.className = 'orb-wrap ' + state;
    statusPill.className = 'status-pill ' + state;
    statusText.textContent = label || state;
  }

  // ---------- orb reactivity from mic level ----------
  let audioCtx, analyser, micStream, rafId;
  function startLevelMeter(stream){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);

    function loop(){
      analyser.getByteFrequencyData(data);
      let sum = 0;
      for (let i=0;i<data.length;i++) sum += data[i];
      const avg = sum / data.length; // 0-255
      const level = Math.min(1, avg / 60);
      const scale = 1 + level * 0.22;
      orbWrap.style.transform = `scale(${scale})`;
      orbGlow.style.opacity = 0.45 + level * 0.5;
      rafId = requestAnimationFrame(loop);
    }
    loop();
  }
  function stopLevelMeter(){
    if (rafId) cancelAnimationFrame(rafId);
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    if (audioCtx) audioCtx.close();
    orbWrap.style.transform = '';
    orbGlow.style.opacity = '';
  }

  // ---------- synthetic pulse while Miri speaks (no mic input to analyse) ----------
  let speakPulseId;
  function startSpeakPulse(){
    let t = 0;
    function loop(){
      t += 0.12;
      const level = (Math.sin(t) + 1) / 2 * 0.6 + Math.random()*0.15;
      const scale = 1 + level * 0.16;
      orbWrap.style.transform = `scale(${scale})`;
      orbGlow.style.opacity = 0.4 + level * 0.45;
      speakPulseId = requestAnimationFrame(loop);
    }
    loop();
  }
  function stopSpeakPulse(){
    if (speakPulseId) cancelAnimationFrame(speakPulseId);
    orbWrap.style.transform = '';
    orbGlow.style.opacity = '';
  }

  // ---------- speech recognition ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizing = false;
  let recognition;

  if (!SR){
    hint.textContent = 'This browser has no built-in speech recognition — try Chrome on Android.';
  } else {
    recognition = new SR();
    recognition.lang = 'en-US';
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onstart = () => {
      recognizing = true;
      micBtn.classList.add('on');
      setState('listening', 'listening');
      transcript.classList.remove('dim');
      transcript.textContent = 'Listening…';
      navigator.mediaDevices.getUserMedia({audio:true}).then(stream => {
        micStream = stream;
        startLevelMeter(stream);
      }).catch(()=>{});
    };

    recognition.onresult = (e) => {
      let text = '';
      for (let i=0; i<e.results.length; i++) text += e.results[i][0].transcript;
      transcript.textContent = text;
      if (e.results[e.results.length-1].isFinal){
        handleUtterance(text.trim());
      }
    };

    recognition.onerror = (e) => {
      setState('error', 'mic error');
      hint.textContent = 'Mic error: ' + e.error + '. Check permission and try again.';
    };

    recognition.onend = () => {
      recognizing = false;
      micBtn.classList.remove('on');
      stopLevelMeter();
      if (statusText.textContent === 'listening') setState('idle','idle');
    };
  }

  const NATIVE = !!window.AndroidBridge; // true when running inside the Miri Android app

  if (NATIVE) {
    hint.textContent = 'Running as the Miri app — using native mic and voice.';
    micBtn.addEventListener('click', () => {
      if (recognizing) { window.AndroidBridge.stopListening(); return; }
      window.AndroidBridge.startListening();
    });

    window.onNativeListenStart = () => {
      recognizing = true;
      micBtn.classList.add('on');
      setState('listening', 'listening');
      transcript.classList.remove('dim');
      transcript.textContent = 'Listening…';
    };
    window.onNativeListenEnd = () => {
      recognizing = false;
      micBtn.classList.remove('on');
      if (statusText.textContent === 'listening') setState('idle', 'idle');
    };
    window.onNativeResult = (text, isFinal) => {
      transcript.textContent = text;
      if (isFinal && text.trim()) handleUtterance(text.trim());
    };
    window.onNativeLevel = (rmsdB) => {
      // rmsdB roughly -2 (silence) to ~10 (loud) from Android's recognizer
      const level = Math.max(0, Math.min(1, (rmsdB + 2) / 10));
      const scale = 1 + level * 0.22;
      orbWrap.style.transform = `scale(${scale})`;
      orbGlow.style.opacity = 0.45 + level * 0.5;
    };
    window.onNativeSpeakStart = () => { setState('speaking', 'speaking'); startSpeakPulse(); };
    window.onNativeSpeakEnd = () => {
      stopSpeakPulse();
      setState('idle', 'idle');
      transcript.classList.add('dim');
      transcript.textContent = 'Tap the mic and talk to Miri';
    };
  } else {
    micBtn.addEventListener('click', () => {
      if (!recognition) return;
      if (recognizing){ recognition.stop(); return; }
      speechSynthesis.cancel();
      try { recognition.start(); } catch(e){}
    });
  }

  // ---------- reply logic (swap this for a real backend / LLM call) ----------
  const BACKEND_URL = 'http://127.0.0.1:8765/ask'; // Termux backend, see termux_assistant.py

  function handleUtterance(text){
    setState('thinking', 'thinking');
    transcript.classList.add('dim');
    transcript.textContent = 'Thinking…';

    fetch(BACKEND_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({text})
    })
    .then(r => r.json())
    .then(data => speak(data.reply))
    .catch(() => {
      // Termux backend not reachable — fall back to the local demo brain.
      speak(craftReply(text));
    });
  }

  function craftReply(text){
    const t = text.toLowerCase();
    if (t.includes('time')) {
      return "It's " + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + ".";
    }
    if (t.includes('your name') || t.includes('who are you')) {
      return "I'm Miri.";
    }
    return "I heard: " + text + ". Wire me up to your Termux backend for real answers.";
  }

  // ---------- calm text-to-speech ----------
  let voices = [];
  function loadVoices(){
    voices = speechSynthesis.getVoices();
    voiceSelect.innerHTML = '';
    const preferred = voices.filter(v => /en-/i.test(v.lang));
    (preferred.length ? preferred : voices).forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = v.name;
      opt.textContent = v.name.replace('Google ', '').replace('Microsoft ', '');
      voiceSelect.appendChild(opt);
    });
    // try to default to a calm-sounding voice
    const calmGuess = voices.find(v => /female|zira|samantha|aria|jenny/i.test(v.name));
    if (calmGuess) voiceSelect.value = calmGuess.name;
  }
  loadVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;

  function speak(text){
    transcript.classList.remove('dim');
    transcript.textContent = text;
    setState('speaking', 'speaking');

    if (window.AndroidBridge) {
      window.AndroidBridge.speak(text, parseFloat(rateSelect.value));
      return; // onNativeSpeakStart/End (wired above) drive the orb + state
    }

    const utter = new SpeechSynthesisUtterance(text);
    const chosen = voices.find(v => v.name === voiceSelect.value);
    if (chosen) utter.voice = chosen;
    utter.rate = parseFloat(rateSelect.value);
    utter.pitch = 0.95; // very slightly lower = calmer
    utter.onstart = () => startSpeakPulse();
    utter.onend = () => {
      stopSpeakPulse();
      setState('idle', 'idle');
      transcript.classList.add('dim');
      transcript.textContent = 'Tap the mic and talk to Miri';
    };
    utter.onerror = () => { stopSpeakPulse(); setState('idle','idle'); };
    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
  }

})();
</script>
</body>
</html>
